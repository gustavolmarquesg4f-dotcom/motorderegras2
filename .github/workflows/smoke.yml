name: Production smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check homepage and health
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://motorderegras2.vercel.app"
          echo "Checking homepage..."
          curl --retry 2 --retry-delay 2 --max-time 30 -L -fsS "$BASE/" -o home.html
          grep -q 'Plano Justo' home.html
          echo "Checking v13 UI assets..."
          js=$(grep -Eo 'src="/assets/[^"]+[.]js"' home.html | head -1 | cut -d'"' -f2)
          test -n "$js"
          curl --retry 2 --retry-delay 2 --max-time 30 -L -fsS "$BASE$js" -o frontend.js
          grep -Fq 'Importar planilha' frontend.js
          grep -Fq 'Glossário' frontend.js
          grep -Fq 'Dossiê e documentos' frontend.js
          grep -Fq 'PDF completo e justificativas' frontend.js
          grep -Fq 'Memória jurídica do seu processo' frontend.js
          grep -Fq 'Importar complemento do processo' frontend.js
          grep -Fq 'Representantes, bancos e atuação documentada' frontend.js
          grep -Fq 'Revisão por especialidade' frontend.js
          grep -Fq 'Testar conexão' frontend.js
          grep -Fq 'Proposta Global' frontend.js || true
          grep -Fq 'PDF completo e justificativas' frontend.js
          echo "v13 importer and glossary found in JS bundle"
          echo "Checking backend v13 (wait for production alias)..."
          ok=0
          for i in $(seq 1 18); do
            curl --max-time 30 -L -fsS "$BASE/api/health" -o health.json || true
            if node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('health.json'));process.exit(x.name==='Plano Justo API'&&x.version==='13.0.0'&&x.configured?0:1)}catch{process.exit(1)}"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          cat health.json
          node -e "const x=require('./health.json');console.log({version:x.version,configured:x.configured,aiConfigured:x.aiConfigured,aiProvider:x.aiProvider,aiModel:x.aiModel,aiVerified:x.aiVerified});if(x.aiProvider!=='groq'||!x.aiConfigured)throw Error('Groq nao esta configurada no deployment de producao')"
          echo "Checking public frontend config..."
          curl --retry 2 --retry-delay 2 --max-time 30 -L -fsS "$BASE/api/config" -o config.json
          node -e "const x=require('./config.json');if(!x.configured||!x.url.startsWith('https://')||!x.publishableKey.startsWith('sb_publishable_'))throw Error('Missing safe Supabase public configuration'); console.log('Supabase public config found')"

      - name: Reject anonymous chat and database requests
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://motorderegras2.vercel.app"
          status=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"question":"olá","caseId":"00000000-0000-0000-0000-000000000000"}' "$BASE/api/chat")
          echo "Anonymous response: HTTP $status"
          test "$status" = 401
          echo "Anonymous chat blocked: HTTP $status"
          probe_status=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST "$BASE/api/ai-probe")
          test "$probe_status" = 401
          echo "Anonymous AI probe blocked: HTTP $probe_status"
          node -e "const cfg=require('./config.json');fetch(cfg.url+'/rest/v1/cases?select=id',{headers:{apikey:cfg.publishableKey}}).then(r=>{if(r.status===200)throw Error('Anonymous finance table accessible');console.log('Anonymous finance read blocked: HTTP '+r.status)}).catch(e=>{console.error(e);process.exit(1)})"
